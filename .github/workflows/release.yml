name: Build & release

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build and release, e.g. v0.3.0. Leave empty for a test build."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libgl1 libfontconfig1 libdbus-1-3
      - run: pip install -e ".[dev]"
      - run: pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

  build:
    needs: test
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
          - os: macos-latest
            target: macos-arm64
          - os: macos-15-intel
            target: macos-x64
          - os: ubuntu-22.04
            target: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install . pyinstaller
      - name: Read version
        id: version
        shell: bash
        run: echo "version=$(python -c 'import lightdeck; print(lightdeck.__version__)')" >> "$GITHUB_OUTPUT"
      - name: Bundle with PyInstaller
        run: pyinstaller --noconfirm packaging/pyinstaller/lightdeck.spec

      - name: Windows installer (Inno Setup)
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.version.outputs.version }}" packaging\windows\lightdeck.iss

      - name: macOS disk image
        if: startsWith(matrix.target, 'macos')
        run: |
          mkdir -p dmg && cp -R dist/Lightdeck.app dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname Lightdeck -srcfolder dmg -ov -format UDZO \
            "dist/Lightdeck-${{ steps.version.outputs.version }}-${{ matrix.target }}.dmg"

      - name: Linux tarball
        if: matrix.target == 'linux-x64'
        run: |
          cp packaging/linux/lightdeck.desktop dist/lightdeck/
          cp src/lightdeck/assets/lightdeck.png dist/lightdeck/
          tar -C dist -czf "dist/lightdeck-${{ steps.version.outputs.version }}-linux-x64.tar.gz" lightdeck

      - uses: actions/upload-artifact@v4
        with:
          name: lightdeck-${{ matrix.target }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Lightdeck ${{ inputs.tag || github.ref_name }}
          files: artifacts/*
          generate_release_notes: true
