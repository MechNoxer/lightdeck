[project]
name = "lightdeck"
version = "0.3.0"
description = "Desktop remote for Hue lights: rooms, scenes, colors"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "PySide6-Essentials>=6.8",
  "requests>=2.32",
  "urllib3>=2",
  "zeroconf>=0.132",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pillow>=10"]

[project.scripts]
lightdeck = "lightdeck.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
lightdeck = ["assets/*.png"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
